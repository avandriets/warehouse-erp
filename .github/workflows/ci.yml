name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_DATABASE_URL: mariadb+pymysql://user:password@127.0.0.1:3306/warehouse_app
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      APP_SQL_ECHO: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest
